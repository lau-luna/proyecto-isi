[project]
name = "proyecto"
version = "0.1.0"
description = "Q&A website"
readme = "README.md"
authors = [
    { name = "Lautaro Luna", email = "lautaroluna906@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "flask>=3.1.3",
    "jinja2>=3.1.6",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "sqlalchemy>=2.1.5",
]

[project.scripts]
proyecto = "proyecto:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
