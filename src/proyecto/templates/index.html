<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- 1. Tema visual de Prism.js (One Dark) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism-themes/1.9.0/prism-one-dark.min.css" />

    <!-- 2. Componente web md-block -->

  <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
>

  <body>
      
    <nav class="container has-text-centered">
      <h1 class="title is-1">Q&A site</h1>
    </nav>

    {% if person %}
    <h1>hello {{ person }}!</h1>
    {% else %}
    <h1>Hello world!</h1>
    {% endif %}

    <md-block>
      ## Hola

        public static int suma(int a, int b) {
          return a + b;

          System.out.println(suma(1+2));
        }
      }
       
      ```
    </md-block>
