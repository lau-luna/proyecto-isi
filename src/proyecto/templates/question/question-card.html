<div class="box question-card">
  <div class="is-flex">
    <a class="pr-2" href="/category/{{ question.category.id }}">
      <span class="icon-text has-text-primary">
        <span class="icon">
          <i class="fa-solid fa-layer-group"></i>
        </span>
        <span>{{ question.category.name }}</span>
      </span>
    </a>
    <p class="help">• {{ question.published_at }}</p>
  </div>
  <span class="help mt-0 mb-4">
    <i class="fa-regular fa-user"></i>
    <span> {{ question.author.get_display_name() }} </span>
  </span>
  <h1 class="title is-4 mb-4">
    <a
      class="question-card-link"
      href="{{ url_for('question.question_detail', question_id=question.id) }}"
    >
      {{ question.title }}
    </a>
  </h1>
  <div class="tags is-flex">
    {% for tag in question.tags %} {# TODO: make a link for every tag Tag Search
    with this tag.id #}
    <a href="/tag/{{ tag.id }}">
      <span class="tag">
        <span class="icon">
          <i class="fa-solid fa-tag"></i>
        </span>
        <span> {{tag.name}} </span>
      </span>
    </a>
    {% endfor %}
  </div>
  <div class="content mb-4">
    <md-block>{{ question.body }}</md-block>
  </div>
  <div class="buttons mt-4 mb-0">
    <button class="button is-rounded">
      <span class="icon-text">
        <span class="icon">
          <i class="fa-solid fa-arrow-up-long"></i>
        </span>
        {# TODO: get number of upvotes #}
        <span>#n</span>
      </span>
    </button>
    <button class="button is-rounded">
      <span class="icon-text">
        <span class="icon">
          <i class="fa-solid fa-arrow-down-long"></i>
        </span>
        {# TODO: get number of downvotes #}
        <span>#n</span>
      </span>
    </button>
    <button class="button is-rounded">
      <span class="icon-text">
        <span class="icon">
          <i class="fa-regular fa-comment"></i>
        </span>
        {# TODO: get number of answers #}
        <span>#n</span>
      </span>
    </button>
    <button class="button is-rounded">
      <span class="icon">
        <i class="fa-solid fa-share"></i>
      </span>
    </button>
  </div>
</div>
